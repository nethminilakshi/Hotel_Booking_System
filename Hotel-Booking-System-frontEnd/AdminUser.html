<div id="content">
<section id="UserForm">
  <div id="userHeaderSection" class="userHeader-section">
    <h2> Users <span>Manage</span></h2>
    <button id="add-user" class="add-user-button">Add Users</button>
  </div>

  <!-- User Registration Form -->
  <div class="user-register-form" id="user-register-form">
    <div class="user-register-box">
      <span id="user-register-close" class="user-register-close">&times;</span>

      <h2 class="user-register-title">Register User</h2>

      <form id="user-form">
        <!-- name -->
        <div class="user-form-row">
          <input type="text" id="user-name" name="user-name" placeholder="userName" required>
        </div>
        <!-- Email -->
        <div class="user-form-row">
          <input type="email" id="user-email" name="user-email" placeholder="Email" required>
        </div>
        <!-- Contact -->
        <div class="user-form-row">
          <input type="text" id="user-contact" name="user-contact" placeholder="Contact" required>
        </div>

        <!-- Password with Show/Hide Option -->
        <div class="user-form-row">
          <div class="password-container">
            <input
              type="password"
              id="user-password"
              name="user-password"
              placeholder="Password"
              required>
            <button
              type="button"
              id="toggle-password"
              class="toggle-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

<!--        &lt;!&ndash; Role Dropdown &ndash;&gt;-->
<!--        <div class="user-form-row">-->
<!--          <div class="user-dropdown-group">-->
<!--            <label for="user-role"></label>-->
<!--            <select id="user-role" name="user-role" required>-->
<!--              <option value="">Select Role</option>-->
<!--              <option value="MANAGER">MANAGER</option>-->
<!--              <option value="ADMIN">ADMIN</option>-->
<!--            </select>-->
<!--          </div>-->
<!--        </div>-->

        <!-- Submit Button -->
        <button id="user-register-submit" type="submit" class="user-register-submit">Submit</button>
      </form>
    </div>
  </div>

  <!-- User Table -->
  <div class="table-container">
    <table class="user-table">
      <thead>
      <tr>
        <th>userId</th>
        <th>Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>Password</th>
        <th>Role</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      </thead>
      <tbody>
      <!-- Rows with user data will be dynamically inserted here -->
      </tbody>
    </table>
  </div>


</section>
