<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/Booking.css">
  <link rel="stylesheet" href="css/SignUp.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<!-- Booking page registration button -->
<div class="text-center mt-3">
  <button id="openRegisterBtn" class="btn btn-outline-primary">Register</button>
</div>


<div class="booking-container container py-4">
  <h2 class="text-center mb-4">Book Your Room</h2>

  <!-- Hotel ID Dropdown -->
  <div class="mb-3">
    <label for="hotelId" class="form-label">Select Hotel</label>
    <select id="hotelId" class="form-select">
      <option selected value="">-- Select Hotel --</option>
    </select>
  </div>

  <!-- Check-in Date -->
  <div class="form-group mt-3">
    <label for="checkinDate">Check-in Date</label>
    <input type="date" id="checkinDate" class="form-control">
  </div>

  <!-- Checkout Date -->
  <div class="form-group mt-3">
    <label for="checkoutDate">Check-out Date</label>
    <input type="date" id="checkoutDate" class="form-control">
  </div>

  <!-- Time Slot Selection -->
  <div class="form-group mt-3">
    <label for="timeSlotSelect">Choose Time Slot</label>
    <select id="timeSlotSelect" class="form-control">
      <option value="day">Day Time (9:00 AM - 4:00 PM)</option>
      <option value="night">Night Time (5:00 PM - 8:00 AM)</option>
    </select>
  </div>

  <!-- Room Type Selection -->
  <div class="form-group mt-4">
    <label for="roomTypeSelect">Room Type</label>
    <select id="roomTypeSelect" class="form-control">
      <option value="">-- Select Room Type --</option>
    </select>
  </div>

  <!-- Room Availability Info -->
  <div id="roomAvailabilityInfo" class="mt-2 text-success fw-bold"></div>

  <!-- Number of Rooms to Book -->
  <div class="form-group mt-4">
    <label for="roomQtyInput">Number of Rooms to Book</label>
    <input type="number" id="roomQtyInput" class="form-control" min="1" placeholder="Enter room quantity">
  </div>

  <!-- Book Button -->
  <div class="mt-4">
    <button id="bookRoomButton" class="btn btn-primary w-100" disabled>Book Room</button>
  </div>

  <!-- Optional Auth Links (kept for fallback) -->
  <div class="auth-buttons text-center mt-3">
    <a href="login.html" class="btn btn-outline-secondary btn-sm">Login</a>
  </div>
</div>

<!--  Registration Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h5 class="modal-title mb-2" id="registerModalLabel">Register to Continue Booking</h5>
      <div class="modal-body">
        <input id="nameSignUp" class="form-control" type="text" placeholder="Full Name" required>
        <input id="emailSignUp" class="form-control" type="email" placeholder="Email" required>
        <input id="contactSignUp" class="form-control" type="tel" placeholder="Phone Number" required>
        <input id="passwordSignUp" class="form-control" type="password" placeholder="Password" required>
        <input id="confPasswordSignUp" class="form-control" type="password" placeholder="Confirm Password" required>
        <div class="checkbox-group mt-2">
          <label>
            <input type="checkbox">
            Remember Me
          </label>
        </div>
        <button class="btn btn-success w-100 mt-2" id="registerSubmitBtn">Register & Book</button>
      </div>
    </div>
  </div>
</div>

<!--  Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3" id="paymentModalLabel">Complete Your Payment</h5>
      <div class="modal-body">
        <div class="form-group mb-2">
          <label>Cardholder Name</label>
          <input type="text" class="form-control" id="cardName" placeholder="Name on Card">
        </div>
        <div class="form-group mb-2">
          <label>Card Number</label>
          <input type="text" class="form-control" id="cardNumber" placeholder="xxxx-xxxx-xxxx-xxxx">
        </div>
        <div class="row mb-2">
          <div class="col">
            <label>Expiry</label>
            <input type="text" class="form-control" id="cardExpiry" placeholder="MM/YY">
          </div>
          <div class="col">
            <label>CVV</label>
            <input type="text" class="form-control" id="cardCVV" placeholder="123">
          </div>
        </div>
        <div class="form-group mb-3">
          <label>Total Amount</label>
          <input type="text" class="form-control" id="paymentAmount" readonly>
        </div>
        <button class="btn btn-success w-100" id="payNowBtn">Pay Now</button>
      </div>
    </div>
  </div>
</div>


<script src="js/booking.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
