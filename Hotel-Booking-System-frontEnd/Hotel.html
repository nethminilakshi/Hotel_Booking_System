<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/Hotel.css">
  <link rel="stylesheet" href="css/AdminDashboard.css">
</head>
<body>
<div class="wrapper">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <img src="https://via.placeholder.com/40" alt="Logo" class="logo">
      <p class="text-muted small"> Admin Dashboard</p>
    </div>
    <div class="sidebar-content">
      <ul class="list-unstyled components">
        <li><a href="AdminDashboard.html"><i class="bi bi-grid-1x2"></i> Overview</a></li>
        <li class="active"><a href="Hotel.html"><i class="bi bi-building"></i> Hotels</a></li>
        <li><a href="RoomsType.html"><i class="bi bi-door-open"></i> Rooms</a></li>
        <li><a href="Bookings.html"><i class="bi bi-calendar-check"></i> Bookings</a></li>
        <li><a href="Payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div id="content">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <h4 class="mb-0">Hotel Management</h4>
        <button class="btn btn-primary" onclick="openAddModal()">
          <i class="bi bi-plus-lg"></i> Add New Hotel
        </button>
      </div>
    </nav>

    <!-- Hotel Table -->
    <div class="card mt-4">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
            <tr>
              <th>Hotel ID</th>
              <th>Image</th>
              <th>Name</th>
              <th>Location</th>
              <th>Description</th>
              <th>Manager ID</th>
              <th>Action</th>
            </tr>
            </thead>
            <tbody id="hotelTableBody">
            <!-- Data will be loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Hotel Modal -->
<div class="modal fade" id="hotelModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Hotel Form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="hotelForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="hotel_id" class="form-label">Hotel ID</label>
            <input type="text" class="form-control" id="hotel_id" required>
          </div>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="manager_id" class="form-label">Manager ID</label>
            <input type="text" class="form-control" id="manager_id" required>
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Hotel Image</label>
            <input type="file" class="form-control" id="image" accept="image/*" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Edit Hotel Modal -->
<div class="modal fade" id="editHotelModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Hotel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editHotelForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="edit_hotel_id" class="form-label">Hotel ID</label>
            <input type="text" class="form-control" id="edit_hotel_id" readonly>
          </div>
          <div class="mb-3">
            <label for="edit_name" class="form-label">Name</label>
            <input type="text" class="form-control" id="edit_name" required>
          </div>
          <div class="mb-3">
            <label for="edit_location" class="form-label">Location</label>
            <input type="text" class="form-control" id="edit_location" required>
          </div>
          <div class="mb-3">
            <label for="edit_description" class="form-label">Description</label>
            <textarea class="form-control" id="edit_description" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="edit_manager_id" class="form-label">Manager ID</label>
            <input type="text" class="form-control" id="edit_manager_id" required>
          </div>
          <div class="mb-3">
            <label for="edit_image" class="form-label">Hotel Image (Optional)</label>
            <input type="file" class="form-control" id="edit_image" accept="image/*">
            <small class="text-muted">Leave empty to keep current image</small>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Update</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Hotel.js"></script>
</body>
</html>
