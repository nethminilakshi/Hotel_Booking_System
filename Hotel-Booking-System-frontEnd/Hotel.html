<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/Hotel.css">
  <link rel="stylesheet" href="css/AdminDashboard.css">
</head>
<body>
<div class="wrapper">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <img src="https://via.placeholder.com/40" alt="Logo" class="logo">
      <p class="text-muted small"> Admin Dashboard</p>
    </div>
    <div class="sidebar-content">
      <ul class="list-unstyled components">
        <li><a href="AdminDashboard.html"><i class="bi bi-grid-1x2"></i> Overview</a></li>
        <li class="active"><a href="Hotel.html"><i class="bi bi-building"></i> Hotels</a></li>
        <li><a href="RoomsType.html"><i class="bi bi-door-open"></i> Rooms</a></li>
        <li><a href="Bookings.html"><i class="bi bi-calendar-check"></i> Bookings</a></li>
        <li><a href="Payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div id="content">
    <section id="HotelsForm">
      <div id="hotelHeaderSection" class="hotel-header-section">
        <h2> Hotels Manage</span></h2>
        <button id="add-hotel" class="add-hotel-button">Add Hotel Details</button>
      </div>

      <!-- Hotel Registration Form -->
      <div class="hotel-register-form" id="hotel-register-form">
        <div class="hotel-register-box">
          <span id="hotel-register-close" class="hotel-register-close">&times;</span>

          <h2 class="hotel-register-title">Register Hotel</h2>

          <form id="hotel-form">
            <!-- Hotel ID and Name -->
            <div class="hotel-form-row">
              <input type="text" id="hotel-id" name="hotel-id" placeholder="Hotel ID" required>
              <input type="text" id="hotel-name" name="hotel-name" placeholder="Hotel Name" required>
            </div>

            <!-- Location and Description -->
            <div class="hotel-form-row">
              <input type="text" id="hotel-location" name="hotel-location" placeholder="Location" required>
              <textarea id="hotel-description" name="hotel-description" placeholder="Description" required></textarea>
            </div>

            <!-- Manager Dropdown (Foreign Key) -->
            <div class="hotel-form-row manager-dropdown-row">
              <select id="hotel-manager" name="hotel-manager" required>
                <option value="">Select Manager</option>
                <!-- Dynamic options for managers will be inserted here -->
              </select>
            </div>

            <!-- Image Upload Field -->
            <div class="hotel-form-row">
              <div class="hotel-image-upload-group">
                <label for="hotel-image">Hotel Image</label>
                <input type="file" id="hotel-image" name="hotelImage" accept="image/*" required>
              </div>
            </div>

            <!-- Image Preview -->
            <div class="hotel-form-row">
              <div id="hotel-image-preview-container" class="hotel-image-preview-container" style="display: none;">
                <img id="hotel-image-preview" class="hotel-image-preview" alt="Hotel Image Preview" />
                <button type="button" id="hotel-remove-image" class="hotel-remove-image-button">Remove</button>
              </div>
            </div>

            <!-- Submit Button -->
            <button id="hotel-register-submit" type="submit" class="hotel-register-submit">Submit</button>
          </form>
        </div>
      </div>

      <!-- Hotel Table -->
      <div class="table-container">
        <table class="hotel-table">
          <thead>
          <tr>
            <th>Hotel ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Description</th>
            <th>Image</th>
            <th>Manager</th>
            <th>Update</th>
            <th>Delete</th>
          </tr>
          </thead>
          <tbody>
          <!-- Rows with hotel data will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </section>
  </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Hotel.js"></script>
</body>
</html>
