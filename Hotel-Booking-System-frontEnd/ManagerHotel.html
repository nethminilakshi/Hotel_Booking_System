</head>

  <!-- Page Content -->
  <div id="content">
    <section id="HotelsForm">
      <div id="hotelHeaderSection" class="hotel-header-section">
        <h2> Hotels Manage</span></h2>
        <button id="add-hotel" class="add-hotel-button">Add Hotel Details</button>
      </div>

      <!-- Hotel Registration Form -->
      <div class="hotel-register-form" id="hotel-register-form">
        <div class="hotel-register-box">
          <span id="hotel-register-close" class="hotel-register-close">&times;</span>

          <h2 class="hotel-register-title">Register Hotel</h2>

          <form id="hotel-form">
            <!-- Hotel Name -->
            <div class="hotel-form-row">
              <input type="text" id="hotel-name" name="hotel-name" placeholder="Hotel Name" required>
            </div>

            <!-- Location and Description -->
            <div class="hotel-form-row">
              <input type="text" id="hotel-location" name="hotel-location" placeholder="Location" required>
              <textarea id="hotel-description" name="hotel-description" placeholder="Description" required></textarea>
            </div>

            <!-- Manager Dropdown (Foreign Key) -->
            <div class="hotel-form-row manager-dropdown-row">
              <button id="load-hotel-ids" class="btn btn-primary">Load Manager Ids</button>
              <label for="managerId"></label>
              <select id="managerId" name="managerId" required>
                <option value="">Select Manager</option>
                <!-- Dynamic options for managers will be inserted here -->
              </select>
            </div>

            <!-- Image Upload Field -->
            <div class="hotel-form-row">
              <div class="hotel-image-upload-group">
                <label for="hotel-image">Hotel Image</label>
                <input type="file" id="hotel-image" name="hotelImage" accept="image/*" required>
              </div>
            </div>

            <!-- Image Preview -->
            <div class="hotel-form-row">
              <div id="hotel-image-preview-container" class="hotel-image-preview-container" style="display: none;">
                <img id="hotel-image-preview" class="hotel-image-preview" alt="Hotel Image Preview" />
                <button type="button" id="hotel-remove-image" class="hotel-remove-image-button">Remove</button>
              </div>
            </div>

            <!-- Submit Button -->
            <button id="hotel-register-submit" type="submit" class="hotel-register-submit">Submit</button>
          </form>
        </div>
      </div>


      <!-- Hotel Modal -->
      <div id="hotelModal" class="modal fade" tabindex="-1" aria-labelledby="hotelModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="hotelModalLabel">Add / Update Hotel</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="hotel-modal-form">
                <input type="hidden" id="modal-hotel-id" name="hotel-id"> <!-- Hidden field for hotel ID -->

                <!-- Hotel Name -->
                <div class="mb-3">
                  <label for="modal-hotel-name" class="form-label">Hotel Name</label>
                  <input type="text" id="modal-hotel-name" name="hotel-name" class="form-control" required>
                </div>

                <!-- Location -->
                <div class="mb-3">
                  <label for="modal-hotel-location" class="form-label">Location</label>
                  <input type="text" id="modal-hotel-location" name="hotel-location" class="form-control" required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                  <label for="modal-hotel-description" class="form-label">Description</label>
                  <textarea id="modal-hotel-description" name="hotel-description" class="form-control" required></textarea>
                </div>

                <!-- Manager Dropdown -->
                <div class="mb-3">
                  <label for="modal-managerId" class="form-label">Manager</label>
                  <select id="modal-managerId" name="managerId" class="form-select" required>
                    <option value="">Select Manager</option>
                    <!-- Managers will be dynamically added here -->
                  </select>
                </div>

                <!-- Image Upload -->
                <div class="mb-3">
                  <label for="modal-hotel-image" class="form-label">Hotel Image</label>
                  <input type="file" id="modal-hotel-image" name="hotelImage" class="form-control" accept="image/*">
                </div>

                <!-- Image Preview -->
                <div class="mb-3" id="modal-hotel-image-preview-container" style="display: none;">
                  <img id="modal-hotel-image-preview" class="img-thumbnail" alt="Hotel Image Preview">
                  <button type="button" id="modal-hotel-remove-image" class="btn btn-danger btn-sm mt-2">Remove</button>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" id="hotel-modal-submit" class="btn btn-primary">Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Hotel Table -->
      <div class="table-container">
        <table class="hotel-table">
          <thead>
          <tr>
            <th>Hotel ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Description</th>
            <th>Image</th>
            <th>Manager</th>
            <th>Update</th>
            <th>Delete</th>
          </tr>
          </thead>
          <tbody>
          <!-- Rows with hotel data will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </section>
  </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Hotel.js"></script>
</body>
</html>
