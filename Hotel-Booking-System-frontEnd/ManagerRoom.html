<div id="content">
<section id="RoomsForm">
  <div id="roomHeaderSection" class="roomHeader-section">
    <h2>Rooms <span>Manage</span></h2>
    <button id="add-room" class="add-room-button">Add Room</button>
  </div>

  <!-- Room Registration Form -->
  <div class="room-register-form" id="room-register-form">
    <div class="room-register-box">
      <span id="room-register-close" class="room-register-close">&times;</span>

      <h2 class="room-register-title">Register Room</h2>

      <form id="room-form">
        <!-- Room ID and Name -->


        <!-- Room Type and Availability Dropdowns -->
        <div class="room-dropdown-group">
          <button id="load-hotel-ids" class="btn btn-primary">Load RoomType Ids</button>
          <label for="room-roomType-id"></label>
          <select id="room-roomType-id" name="room-roomType-id" required>
            <option value="">Select roomTypeId</option>
            <!-- Dynamic hotel options will be inserted here -->
          </select>
        </div>


        <!-- Hotel ID Dropdown -->
        <div class="room-dropdown-group">
          <button id="load-cus-ids" class="btn btn-primary">Load HotelIds</button>
          <label for="room-hotel-id"></label>
          <select id="room-hotel-id" name="room-hotel-id" required>
            <option value="">Select Hotel</option>
            <!-- Dynamic hotel options will be inserted here -->
          </select>
        </div>


          <!-- Availability Dropdown -->
          <div class="room-dropdown-group">

            <label for="room-availability"></label>
            <select id="room-availability" name="room-availability" required>
              <option value="">Select Availability</option>
              <option value="AVAILABLE">AVAILABLE</option>
              <option value="NOT_AVAILABLE">NOT AVAILABLE</option>
            </select>
          </div>

        <!-- Floor Number and Hotel ID Dropdowns -->
        <div class="room-form-row">
          <!-- Floor Number Input -->
          <div class="room-dropdown-group">
            <label for="room-floor-number"></label>
            <input type="number" id="room-floor-number" name="room-floor-number" placeholder="Floor Number" min="1" required>
          </div>


        </div>

        <!-- Submit Button -->
        <button id="room-register-submit" type="submit" class="room-register-submit">Submit</button>
      </form>
    </div>
  </div>


  <!-- Room Table -->
  <div class="table-container">
    <table class="room-table">
      <thead>
      <tr>
        <th>Room ID</th>
        <th>Room Type</th>
        <th>Floor Number</th>
        <th>Hotel</th>
        <th>Availability</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      </thead>
      <tbody  id="customer_table_body">

      </tbody>
    </table>
  </div>

</section>
