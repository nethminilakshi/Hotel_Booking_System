<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Room Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/Room.css">
  <link rel="stylesheet" href="css/AdminDashboard.css">
</head>
<body>
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <div class="header-container">
        <h2>Room Management</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRoomModal">
          <i class="bi bi-plus-circle"></i> Add Room
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
          <tr>
            <th>Room ID</th>
            <th>Room TypeId</th>
            <th>Floor Number</th>
            <th>Hotel Id</th>
            <th>Availability</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody id="roomTableBody">
          <!-- Data will be loaded dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Room Modal -->
<div class="modal fade" id="addRoomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Room</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addRoomForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="roomType" class="form-label">Room TypeId</label>
            <select class="form-select" id="roomType" required>
              <option value="" disabled selected>Select Room Type</option>
              <!-- Will be populated dynamically -->
            </select>
          </div>
          <div class="mb-3">
            <label for="availability" class="form-label">Availability</label>
            <select class="form-select" id="availability" required>
              <option value="true">Available</option>
              <option value="false">Not Available</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="floorNumber" class="form-label">Floor Number</label>
            <input type="number" class="form-control" id="floorNumber" min="1" required>
          </div>
          <div class="mb-3">
            <label for="hotelId" class="form-label">Hotel</label>
            <select class="form-control" id="hotelId" required>
              <option value="" disabled selected>Select Hotel</option>
              <!-- Will be populated dynamically -->
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Update Room Modal -->
<div class="modal fade" id="updateRoomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update Room</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="updateRoomForm" enctype="multipart/form-data">
          <input type="hidden" id="updateRoomId">
          <div class="mb-3">
            <label for="updateRoomType" class="form-label">Room TypeId</label>
            <select class="form-select" id="updateRoomType" required>
              <option value="" disabled>Select Room Type</option>
              <!-- Will be populated dynamically -->
            </select>
          </div>
          <div class="mb-3">
            <label for="updateAvailability" class="form-label">Availability</label>
            <select class="form-select" id="updateAvailability" required>
              <option value="true">Available</option>
              <option value="false">Not Available</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="updateFloorNumber" class="form-label">Floor Number</label>
            <input type="number" class="form-control" id="updateFloorNumber" min="1" required>
          </div>
          <div class="mb-3">
            <label for="updateHotel" class="form-label">Hotel</label>
            <select class="form-select" id="updateHotel" required>
              <option value="" disabled>Select Hotel</option>
              <!-- Will be populated dynamically -->
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Update</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteRoomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this room?</p>
        <input type="hidden" id="deleteRoomId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Room.js"></script>
</body>
</html>
