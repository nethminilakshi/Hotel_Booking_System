<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rooms Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/RoomsType.css">
  <link rel="stylesheet" href="css/AdminDashboard.css">
</head>
<body>
<div class="wrapper">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <img src="https://via.placeholder.com/40" alt="Logo" class="logo">
      <p class="text-muted small"> Admin Dashboard</p>
    </div>
    <div class="sidebar-content">
      <ul class="list-unstyled components">
        <li><a href="AdminDashboard.html"><i class="bi bi-grid-1x2"></i> Overview</a></li>
        <li><a href="Hotels.html"><i class="bi bi-building"></i> Hotels</a></li>
        <li class="active"><a href="RoomsType.html"><i class="bi bi-door-open"></i> Rooms</a></li>
        <li><a href="Bookings.html"><i class="bi bi-calendar-check"></i> Bookings</a></li>
        <li><a href="Payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div id="content">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <h4 class="mb-0">Room Management</h4>
        <button class="btn btn-primary" onclick="openAddModal()">
          <i class="bi bi-plus-lg"></i> Add New Room
        </button>
      </div>
    </nav>

    <!-- Room Table -->
    <div class="card mt-4">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
            <tr>
              <th>Type ID</th>
              <th>Image</th>
              <th>Room Type</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Action</th>
            </tr>
            </thead>
            <tbody id="roomTableBody">
            <!-- Data will be loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/ Room Modal -->
<div class="modal fade" id="roomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Room Form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="roomForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="roomId" class="form-label">Type ID</label>
            <input type="text" class="form-control" id="roomId" required>
          </div>
          <div class="mb-3">
            <select class="form-select" id="roomType" required>
              <option value="" disabled selected>Select Room Type</option>
              <option value="SINGLE">Single</option>
              <option value="DOUBLE">Double</option>
              <option value="SUITE">Suite</option>
              <option value="DELUXE">Deluxe</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" class="form-control" id="price" min="0" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="qtyOnHand" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="qtyOnHand" min="0" required>
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Room Image</label>
            <input type="file" class="form-control" id="image" accept="image/*" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Edit Room Modal -->
<div class="modal fade" id="editRoomModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Room</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editRoomForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="edit_roomId" class="form-label">Type ID</label>
            <input type="text" class="form-control" id="edit_roomId" readonly>
          </div>
          <div class="mb-3">
            <label for="edit_roomType" class="form-label">Room Type</label>
            <select class="form-select" id="edit_roomType" required>
              <option value="" disabled>Select Room Type</option>
              <option value="SINGLE">Single</option>
              <option value="DOUBLE">Double</option>
              <option value="SUITE">Suite</option>
              <option value="DELUXE">Deluxe</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="edit_price" class="form-label">Price</label>
            <input type="number" class="form-control" id="edit_price" min="0" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="edit_qtyOnHand" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="edit_qtyOnHand" min="0" required>
          </div>
          <div class="mb-3">
            <label for="edit_image" class="form-label">Room Image (Optional)</label>
            <input type="file" class="form-control" id="edit_image" accept="image/*">
            <small class="text-muted">Leave empty to keep current image</small>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Update</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/RoomsType.js"></script>
</body>
</html>
