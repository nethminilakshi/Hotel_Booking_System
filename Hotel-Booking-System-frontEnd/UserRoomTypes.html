<script>
  const hamburger = document.querySelector(".hamburger");
  const navMenu = document.querySelector(".nav-menu");

  hamburger.addEventListener("click", mobliemmenu);

  function mobliemmenu() {
    hamburger.classList.toggle("active");
    navMenu.classList.toggle("active");
  }

  window.addEventListener("scroll", function() {
    var header = document.querySelector("header");
    header.classList.toggle("sticky", window.scrollY > 0)
  })
</script>

<section class="site-hero inner-page overlay" style="background-image: url(image/hero_4.jpg)" data-stellar-background-ratio="0.5">
  <div class="container">
    <div class="row site-hero-inner justify-content-center align-items-center">
      <div class="col-md-10 text-center" data-aos="fade">
        <h1 class="headings mb-3">Rooms</h1>

      <span class="mouse-wheel"></span>
    </div>

<section class="book">
  <div class="container flex_space">
    <div class="text">
      <h1> <span>Book </span> Your Rooms </h1>
    </div>
    <div class="form">
      <form class="grid">
        <input type="date" placeholder="Araival Date">
        <input type="date" placeholder="Departure Date">
        <input type="number" placeholder="Adults">
        <input type="number" placeholder="Childern">
        <input type="submit" value="CHECK AVAILABILITY">
      </form>
    </div>
  </div>
</section>


<section class="rooms">
  <div class="container top">
    <div class="heading">
      <h1>EXPOLRE</h1>
      <h2>Our Rooms</h2>
      <p>Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt
      </p>
    </div>

    <section class="hp-room-section">
      <div class="container-fluid">
        <div id="roomItems">

        </div>
      </div>
    </section>
  </div>

  <!-- Room Details Modal -->
  <div id="roomDetailsModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <img id="modal-room-img" src="" alt="Room Image">
      <h2 id="modal-room-title"></h2>
      <p id="modal-room-price"></p>
      <p id="modal-room-capacity"></p>
      <p id="modal-room-available"></p>
      <p id="modal-room-description"></p>
    </div>
  </div>
</section>

<section class="gallary">

    <div class="heading">

      <h2>Gallery</h2>
    </div>
    <div class="gallery-container">
      <div id="roomGallery" class="gallery"></div>
    </div>

  </div>
</section>


<section class="roomType-table">

  <div class="table-container">
    <table class="room-table">
      <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Quantity</th>
      </tr>
      </thead>
      <tbody>
      <!-- Rows with room type data will be dynamically inserted here -->
      </tbody>
    </table>
  </div>
</section>
