<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoomTypes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/UserRoomTypes.css">
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
</head>
<body>
<header class="header">
  <div class="container">
    <nav class="navbar flex1">
      <div class="sticky_logo logo">
        <img src="image/logo.png" alt="">
      </div>

      <ul class="nav-menu">
        <li> <a href="index.html">Home</a> </li>
        <li> <a href="About.html">About</a> </li>
        <li><a href="UserHotels.html">Locations</a></li>
        <li> <a href="UserRoomTypes.html">Rooms</a> </li>
        <li> <a href="#gallery">Gallery</a> </li>
        <li> <a href="#blog">Blog</a> </li>
        <li> <a href="#contact">Contact</a> </li>
      </ul>

      <!-- Login & Register Buttons -->
      <div class="auth-buttons">
        <a href="login.html" class="btn login-btn">Login</a>
        <a href="SignUp.html" class="btn register-btn">Register</a>
      </div>

      <div class="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>


    </nav>
  </div>
</header>
<script>
  const hamburger = document.querySelector(".hamburger");
  const navMenu = document.querySelector(".nav-menu");

  hamburger.addEventListener("click", mobliemmenu);

  function mobliemmenu() {
    hamburger.classList.toggle("active");
    navMenu.classList.toggle("active");
  }

  window.addEventListener("scroll", function() {
    var header = document.querySelector("header");
    header.classList.toggle("sticky", window.scrollY > 0)
  })
</script>
<section class="book">
  <div class="container flex_space">
    <div class="text">
      <h1> <span>Book </span> Your Rooms </h1>
    </div>
    <div class="form">
      <form class="grid">
        <input type="date" placeholder="Araival Date">
        <input type="date" placeholder="Departure Date">
        <input type="number" placeholder="Adults">
        <input type="number" placeholder="Childern">
        <input type="submit" value="CHECK AVAILABILITY">
      </form>
    </div>
  </div>
</section>
<section class="rooms">
  <div class="container top">
    <div class="heading">
      <h1>EXPOLRE</h1>
      <h2>Our Rooms</h2>
      <p>Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt
      </p>
    </div>

    <div class="content mtop">
      <div class="mb-3">
        <input type="text" id="filterInput" class="form-control" onkeyup="filterRooms()" placeholder="Filter by name">
      </div>
      <div class="owl-carousel owl-carousel1 owl-theme" id="roomCarousel"></div>
    </div>
  </div>

</section>
<section class="roomType-table">

  <div class="table-container">
    <table class="room-table">
      <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Quantity</th>
      </tr>
      </thead>
      <tbody>
      <!-- Rows with room type data will be dynamically inserted here -->
      </tbody>
    </table>
  </div>
</section>

<script src="js/UserRoomTypes.js"></script>
<script src="https://kit.fontawesome.com/032d11eac3.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
