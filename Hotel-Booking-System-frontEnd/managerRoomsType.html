  <!-- Page Content -->
  <div id="content">

    <!-- Room Type Management Section -->
  <section id="roomTypeForm">
    <div id="roomHeaderSection" class="room-header-section">
      <h2>Room Type <span>Manage</span></h2>
      <button id="add-room" class="add-room-button">Add Room Type</button>
    </div>

    <!-- Room Type Registration Form -->
    <div class="room-register-form" id="room-register-form">
      <div class="room-register-box">
        <span id="room-register-close" class="room-register-close">&times;</span>

        <h2 class="room-register-title">Register Room Type</h2>

        <form id="room-form">

<!--          roomType name-->
          <div class="room-form-row">
            <input type="text" id="room-name" name="roomType" placeholder="Room Type" required>
          </div>

          <!-- Room Description -->
          <div class="room-form-row">
            <input type="text" id="room-description" name="description" placeholder="Room Description" required>
          </div>

          <!-- Price and Quantity -->
          <div class="room-form-row">
            <input type="number" id="room-price" name="price" placeholder="Price" required step="0.01">
            <input type="number" id="room-qty" name="qtyOnHand" placeholder="Quantity on Hand" required>
          </div>

          <div class="room-form-row">
            <input type="text" id="room-persons" name="noOfPersons" placeholder="no of persons" required>
          </div>

          <!-- Image Upload Field -->
          <div class="room-form-row">
            <div class="room-image-upload-group">
              <label for="room-image">Room Image</label>
              <input type="file" id="room-image" name="image" accept="image/*" required>
            </div>
          </div>

          <!-- Image Preview -->
          <div class="room-form-row" id="image-input-wrapper">
            <div id="room-image-preview-container" class="room-image-preview-container" style="display: none;">
              <img id="room-image-preview" class="room-image-preview" alt="Room Image Preview" />
              <button type="button" id="room-remove-image" class="room-remove-image-button">Remove</button>
            </div>
          </div>

          <!-- Submit Button -->
          <button id="room-register-submit" type="submit" class="room-register-submit">Submit</button>
        </form>
      </div>
    </div>

    <!-- Room Type Table -->
    <div class="table-container">
      <table class="room-table">
        <thead>
        <tr>
          <th>Type ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>No of Persons</th>
          <th>Room Image</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
        </thead>
        <tbody>
        <!-- Rows with room type data will be dynamically inserted here -->
        </tbody>
      </table>
    </div>
  </section>
